<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.min.css" />
    <link rel="stylesheet" href="./css/milligram/normalize.min.css" />
    <title>FTP</title>
    <style></style>
  </head>
  <body>
    <div id="ajax-header"></div>
    <main class="c-f">
      <div class="c c-75 sh">
        <div class="r j-c">
          <div class="bd bd-pr h1 my-3">FTP</div>
        </div>
        <div class="r j-c">
          <div class="h2 bd bd-dg d-n" id="contentErrorId"></div>
        </div>
        <form id="formIndexID" class="r j-c">
          <div class="f-g">
            <label class="j-c">Index</label>
            <input type="number" name="index" id="indexID" min="0" value="1" />
          </div>
        </form>
        <div class="r j-c">
          <button
            class="btn btn-pr my-2"
            id="btnGetFileDataID"
            onclick="getFTPData()"
          >
            Get Data
          </button>
        </div>
        <div class="r d-n" id="containerSpinnerID">
          <div class="r j-c">
            <div class="sp m-1"></div>
          </div>
          <div class="r j-c">
            <div class="bd bd-sc h5">Loading Data</div>
          </div>
        </div>
        <div class="r j-c">
          <div id="containerMessageID"></div>
        </div>
      </div>
      <div class="c c-75 j-c sh d-n" id="containerInfoID">
        <div class="r my-2">
          <div class="cl h5">
            <div class="bd bd-sc" id="volumeNameID"></div>
          </div>
          <div class="cl h5">
            <div id="colSizeID">
              <span id="usedSizeID"></span>
              /
              <span id="totalSpaceID"></span>
            </div>
          </div>
        </div>
        <table class="t">
          <thead>
            <tr>
              <th>File Name</th>
              <th>File Size</th>
              <th>Options</th>
            </tr>
          </thead>
          <tbody id="containerFilesID"></tbody>
        </table>
      </div>
    </main>
  </body>
  <script src="./js/index.min.js"></script>
  <script src="./js/ftp.min.js"></script>
  <script>
    %s
  </script>
</html>
